<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Alumni+Sans+Pinstripe:ital@0;1&display=swap"
            rel="stylesheet"
        />
        <title>Game of Life</title>
    </head>
    <body class="min-h-screen bg-gray-900 px-4 py-8 text-gray-100 sm:py-10">
        <main class="mx-auto flex max-w-5xl flex-col items-center gap-5">
            <header class="text-center">
                <h1 class="text-5xl leading-none font-bold sm:text-7xl">Conway's Game of Life</h1>
                <p class="mt-2 text-lg text-gray-400">
                    Click or drag on cells to change them. Press Start to run it.
                </p>
            </header>

            <!-- Sliders: three across, compact on phones -->
            <div class="grid w-full max-w-3xl grid-cols-3 gap-3 text-base text-gray-300 sm:gap-5 sm:text-lg">
                <label for="speedRange" class="flex flex-col gap-1">
                    <span>Speed: <span id="speedValue">150ms</span></span>
                    <input id="speedRange" type="range" min="20" max="1000" step="10" value="150" class="w-full" />
                </label>
                <label for="rowsRange" class="flex flex-col gap-1">
                    <span>Rows: <span id="rowsValue">50</span></span>
                    <input id="rowsRange" type="range" min="10" max="250" step="1" value="50" class="w-full" />
                </label>
                <label for="colsRange" class="flex flex-col gap-1">
                    <span>Columns: <span id="colsValue">75</span></span>
                    <input id="colsRange" type="range" min="10" max="250" step="1" value="75" class="w-full" />
                </label>
            </div>

            <!-- The canvas sizes itself to this box (see Renderer.fit) -->
            <div class="flex w-full justify-center">
                <canvas id="gameCanvas" class="touch-none shadow-lg ring-1 ring-gray-700"></canvas>
            </div>

            <label for="toggleInfection" class="flex items-center gap-2 text-lg text-gray-300">
                Infection mode
                <input id="toggleInfection" type="checkbox" class="h-5 w-5" />
            </label>

            <div class="flex flex-wrap justify-center gap-2 text-lg">
                <button id="startButton" class="rounded bg-green-600 px-4 py-1.5 text-white shadow hover:bg-green-700">
                    Start
                </button>
                <button id="stopButton" class="rounded bg-yellow-600 px-4 py-1.5 text-white shadow hover:bg-yellow-700">
                    Stop
                </button>
                <button id="resetButton" class="rounded bg-red-600 px-4 py-1.5 text-white shadow hover:bg-red-700">
                    Reset
                </button>
                <button id="randomizeButton" class="rounded bg-blue-400 px-4 py-1.5 text-white shadow hover:bg-blue-500">
                    Randomize
                </button>
                <button
                    id="randomPatternButton"
                    class="rounded bg-purple-600 px-4 py-1.5 text-white shadow hover:bg-purple-700"
                >
                    Random patterns
                </button>
            </div>
        </main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
